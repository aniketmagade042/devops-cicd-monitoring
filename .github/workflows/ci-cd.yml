name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 1. Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 app tests

      - name: Run unit tests
        run: pytest -v

  build:
    name: 2. Build image and integration test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create CI environment file (throwaway values, never real secrets)
        run: |
          {
            echo "APP_ENV=production"
            echo "SECRET_KEY=ci-$(openssl rand -hex 16)"
            echo "POSTGRES_USER=ci"
            echo "POSTGRES_PASSWORD=ci$(openssl rand -hex 8)"
            echo "POSTGRES_DB=guestbook"
            echo "WEB_PORT=8000"
            echo "LOG_LEVEL=INFO"
          } > .env

      - name: Build and start the stack with Docker Compose
        env:
          APP_VERSION: ci-${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
        run: docker compose up -d --build

      - name: Smoke test the running containers
        run: bash scripts/smoke_test.sh http://localhost:8000

      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail 50 web

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: 3. Publish image to GitHub Container Registry
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: 4. Deploy to staging
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create staging environment file
        run: |
          {
            echo "APP_ENV=staging"
            echo "SECRET_KEY=stg-$(openssl rand -hex 16)"
            echo "POSTGRES_USER=staging"
            echo "POSTGRES_PASSWORD=stg$(openssl rand -hex 8)"
            echo "POSTGRES_DB=guestbook"
            echo "WEB_PORT=8000"
            echo "LOG_LEVEL=INFO"
          } > .env

      - name: Deploy the published image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "Deploying $IMAGE"
          WEB_IMAGE="$IMAGE" docker compose up -d --no-build

      - name: Smoke test staging
        run: bash scripts/smoke_test.sh http://localhost:8000

      - name: Show logs
        if: always()
        run: docker compose logs --tail 50 web

      - name: Tear down staging
        if: always()
        run: docker compose down -v

  deploy-production:
    name: 5. Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger production deploy (optional Render deploy hook)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set, so no real production deploy was triggered."
            echo "Add it as a secret on the production environment to enable this step."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Production deploy triggered"

      - name: Post-deploy health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL variable is not set, skipping the production health check."
            exit 0
          fi
          sleep 60
          curl -fsS --max-time 30 "$APP_URL/health"
